<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Navvy Control Lite Preview</title>
  <link rel="stylesheet" href="./style.css?v=20260531a">
</head>
<body data-page="main" data-handed="right" data-theme="dark">
  <header class="chrome">
    <div class="brand" aria-label="Navvy brand">
      <span>NAVVY</span>
      <span>UNMND</span>
    </div>

    <button class="arm-pill arm-pill-disarmed" id="armPill" type="button" aria-live="polite" aria-pressed="false">DISARMED</button>

    <div class="chrome-actions">
      <div class="net-chip" id="netChip" aria-label="Connectivity status">
        <span class="net-chip-text" id="netChipText">Connecting...</span>
        <span class="signal-bars" id="signalBars" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
      </div>
      <a class="icon-btn icon-link" href="./settings-preview.html" aria-label="Open settings">
        <span aria-hidden="true">⚙</span>
      </a>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">
        <span aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <main class="workspace workspace-main">
    <section class="tile summary-tile">
      <div class="summary-line"><span>STATUS:</span><strong id="statusValue">Disarmed</strong></div>
      <div class="summary-line"><span>SOURCE:</span><strong id="sourceValue">RC Controller</strong></div>
      <div class="summary-line"><span>CONTROL MODE:</span><strong id="modeValue">Joystick</strong></div>
      <div class="summary-line"><span>BATTERY:</span><strong id="batteryValue">22.4V</strong></div>
      <div class="mode-inline">
        <span>MODE:</span>
        <div class="segmented" id="modeSeg" role="tablist" aria-label="Control mode selection">
          <button data-mode="joystick" class="seg active" type="button" aria-pressed="true">Joystick</button>
          <button data-mode="tank" class="seg" type="button" aria-pressed="false">Tank</button>
        </div>
      </div>
      <p id="controlHint" class="hint" role="status" aria-live="polite"></p>
    </section>

    <section class="tile control-tile">
      <div id="joystickPanel" class="control-stage">
        <div class="joystick-layout">
          <div class="drive-meter drive-meter-left" aria-label="Throttle left meter">
            <div class="drive-meter-track"><div id="leftDriveBar" class="drive-meter-fill"></div></div>
            <div class="drive-meter-value" id="leftDriveValue">0%</div>
            <div class="drive-meter-label">Throttle Left</div>
          </div>

          <div class="joystick-frame" id="joystickArea" role="application" aria-label="Joystick control pad" tabindex="0">
            <div class="joystick-cross"></div>
            <div class="joystick-thumb" id="joystickThumb"></div>
            <div class="joystick-mark mark-left" aria-hidden="true"></div>
            <div class="joystick-mark mark-right" aria-hidden="true"></div>
          </div>

          <div class="drive-meter drive-meter-right" aria-label="Throttle right meter">
            <div class="drive-meter-track"><div id="rightDriveBar" class="drive-meter-fill drive-meter-fill-right"></div></div>
            <div class="drive-meter-value" id="rightDriveValue">0%</div>
            <div class="drive-meter-label">Throttle Right</div>
          </div>
        </div>
      </div>

      <div id="tankPanel" class="control-stage tank-stage hidden" aria-label="Tank control">
        <div class="tank-column">
          <span class="tank-label">Left</span>
          <div class="tank-track">
            <div class="tank-fill" id="leftFill"></div>
            <input id="leftSlider" class="tank-slider" type="range" min="-100" max="100" value="0" aria-label="Left drive control">
          </div>
        </div>
        <div class="tank-column">
          <span class="tank-label">Right</span>
          <div class="tank-track">
            <div class="tank-fill tank-fill-right" id="rightFill"></div>
            <input id="rightSlider" class="tank-slider" type="range" min="-100" max="100" value="0" aria-label="Right drive control">
          </div>
        </div>
      </div>
    </section>

    <section class="tile actions-tile">
      <a class="action-gear icon-link" href="./settings-preview.html" aria-label="Open settings">
        <span aria-hidden="true">⚙</span>
      </a>
      <button id="armBtn" class="arm-btn arm-btn-disarm" type="button" aria-pressed="false">ARM</button>
    </section>
  </main>

  <footer class="foot">Preview only. Layout, handedness, theme and controls are all active locally.</footer>

  <script src="./app.js?v=20260531a"></script>
</body>

<body>
  <header class="topbar">
    <h1>Navvy Control Lite Preview</h1>

      <div class="page-switch" aria-label="Preview section switcher">

        <button class="chip" id="showSettings" type="button">Settings</button>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">🌙</button>

  </header>

  <main class="container">
    <section id="mainView" class="controls">

      <div class="row">

        </div>
      </div>
      <div class="row center">

          <button data-mode="tank" class="seg" type="button" aria-pressed="false">Tank</button>
        </div>
      </div>
      <div id="joystickArea" class="panel joystick" role="application" aria-label="Joystick control pad" tabindex="0">
        <div id="stick" class="stick"></div>
      </div>
      <div id="tankArea" class="panel hidden" style="display:grid;gap:10px;">
        <label for="leftSlider">Left</label>
        <input id="leftSlider" type="range" min="-100" max="100" value="0">
        <label for="rightSlider">Right</label>

    <section id="settingsView" class="controls hidden">
      <div class="panel">
        <h3 style="margin:0 0 12px;">Settings</h3>
        <div class="settings">

          </div>
          <div>

          <div>

    <aside class="telemetry panel">

  <footer class="foot">Preview only. Mouse, touch, keyboard, and theme switch all work locally.</footer>

  <script>

    $('armBtn').addEventListener('click', () => { state.armed = !state.armed; $('armBtn').textContent = state.armed ? 'DISARM' : 'ARM'; $('armBtn').classList.toggle('danger', state.armed); $('armBtn').setAttribute('aria-pressed', state.armed ? 'true' : 'false'); $('tele-armed').textContent = state.armed ? 'true' : 'false'; });
    $('neutralBtn').addEventListener('click', () => { state.current = { x: 0, y: 0 }; state.target = { x: 0, y: 0 }; $('stick').style.transform = 'translate(0px, 0px)'; $('leftSlider').value = '0'; $('rightSlider').value = '0'; setTelemetry(0, 0); setHint('Returned to neutral.'); });
    const area = $('joystickArea');

    let active = false;
    const pointerXY = (e) => { const r = area.getBoundingClientRect(); return { x: clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1), y: clamp(-(((e.clientY - r.top) / r.height) * 2 - 1), -1, 1) }; };
