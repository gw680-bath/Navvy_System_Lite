<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Navvy Settings Preview</title>
  <link rel="stylesheet" href="./style.css?v=20260531a">
</head>
<body data-page="settings" data-handed="right" data-theme="dark">
  <header class="chrome">
    <div class="brand brand-back">
      <a class="icon-link back-link" href="./preview.html" aria-label="Return to main control page"><span aria-hidden="true">←</span></a>
      <span>NAVVY</span>
      <span>UNMND</span>
    </div>

    <button class="arm-pill arm-pill-disarmed" id="armPill" type="button" aria-live="polite" aria-pressed="false">DISARMED</button>

    <div class="chrome-actions">
      <div class="net-chip" id="netChip" aria-label="Connectivity status">
        <span class="net-chip-text" id="netChipText">Connecting...</span>
        <span class="signal-bars" id="signalBars" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">
        <span aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <main class="workspace workspace-settings">
    <section class="tile summary-tile settings-info">
      <div class="summary-line"><span>DEVICE MAC:</span><strong id="deviceMac">--</strong></div>
      <div class="summary-line"><span>WI-FI NETWORK:</span><strong id="wifiNetwork">--</strong></div>
      <div class="summary-line"><span>SSID:</span><strong id="wifiSsidInfo">--</strong></div>
      <div class="summary-line"><span>FIRMWARE:</span><strong id="firmwareVersion">0.1.0</strong></div>
      <div class="summary-line"><span>CONNECTIVITY:</span><strong id="connectivityState">--</strong></div>
      <div class="summary-line summary-line-signal"><span>SIGNAL:</span><strong><span id="signalValue">--</span><span class="signal-bars inline" id="settingsSignalBars" aria-hidden="true"><span></span><span></span><span></span><span></span></span></strong></div>
      <div class="summary-line"><span>WEB SOCKET:</span><strong id="websocketState">--</strong></div>
    </section>

    <section class="tile settings-tile">
      <h2>Settings</h2>
      <p class="hint">These controls only change layout and connection details. Left-handed mode swaps the button positions without changing the surrounding text.</p>

      <div class="setting-block">
        <label>Handedness</label>
        <div class="segmented" id="handedSeg" role="tablist" aria-label="Handedness selection">
          <button data-handed="left" class="seg" type="button" aria-pressed="false">Left</button>
          <button data-handed="right" class="seg active" type="button" aria-pressed="true">Right</button>
        </div>
      </div>

      <div class="setting-block">
        <label for="wifiSsid">Wi-Fi SSID</label>
        <input id="wifiSsid" type="text" placeholder="Navvy-Lite-01" autocomplete="off">
      </div>

      <div class="setting-block">
        <label for="wifiPassword">Wi-Fi Password</label>
        <input id="wifiPassword" type="password" placeholder="••••••••">
      </div>

      <div class="settings-actions">
        <button id="wifiSaveBtn" type="button" class="arm-btn arm-btn-arm">SAVE WIFI</button>
      </div>

      <div id="wifiStatus" class="status-note" aria-live="polite">Idle</div>
    </section>

  </main>

  <script src="./app.js?v=20260531a"></script>
</body>
</html>
